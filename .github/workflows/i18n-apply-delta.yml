name: Apply i18n French Delta

on:
  schedule:
    # Run daily at 08:17 UTC (03:17 AM EST / 04:17 AM EDT in Montreal), after Gemini's 02:00 AM sweep
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  apply-delta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: automation
          path: automation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply i18n-delta-fr.json on i18n/fr-sync
        id: apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" i18n/fr-sync >/dev/null 2>&1; then
            echo "Branch i18n/fr-sync does not exist yet. Nothing to apply."
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git clone --branch i18n/fr-sync --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" sync-work
          cd sync-work

          if [ ! -f "i18n-delta-fr.json" ]; then
            echo "No pending i18n-delta-fr.json on i18n/fr-sync."
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm install --no-save typescript
          node ../automation/scripts/apply-i18n-delta.mjs i18n-delta-fr.json
          node scripts/test-i18n-gettext.mjs
          cp ../automation/scripts/check-i18n-gaps.mjs ./.tmp-check-i18n-gaps.mjs
          node ./.tmp-check-i18n-gaps.mjs --strict
          rm -f ./.tmp-check-i18n-gaps.mjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/i18n/fr.json i18n-delta-fr.json
          git commit -m "i18n(fr): apply automated French translation delta"
          git push origin i18n/fr-sync
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Ensure Draft PR and close tracking issue
        if: steps.apply.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --repo "${{ github.repository }}" --head "i18n/fr-sync" --base "main" --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head i18n/fr-sync \
              --draft \
              --title "i18n(fr): sync French translations from upstream" \
              --body "Rolling French localization branch kept in sync with \`upstream/main\`. Automated deltas from \`i18n-delta-fr.json\` are merged into \`src/lib/i18n/fr.json\` and validated with \`test-i18n-gettext.mjs\` and \`check-i18n-gaps.mjs --strict\`. Ready for playtesting and upstream PR whenever you are."
          fi

          ISSUE_NUM=$(gh issue list --repo "${{ github.repository }}" --label "i18n-automation" --state open --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE_NUM" ]; then
            gh issue close "$ISSUE_NUM" --repo "${{ github.repository }}" --comment "Applied \`i18n-delta-fr.json\` to \`i18n/fr-sync\` and verified 0 remaining missing keys."
          fi
