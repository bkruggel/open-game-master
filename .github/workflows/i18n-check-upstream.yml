name: Check Upstream i18n Gaps

on:
  schedule:
    # Run daily at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: automation
          path: automation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync main with upstream and scan for gaps
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch main --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" upstream-work
          cd upstream-work
          PREV_SHA=$(git rev-parse HEAD)
          git remote add upstream https://github.com/Lebbitheplow/open-game-master.git
          git fetch upstream main
          UPSTREAM_SHA=$(git rev-parse upstream/main)

          if [ "$PREV_SHA" != "$UPSTREAM_SHA" ]; then
            git reset --hard "$UPSTREAM_SHA"
            git push origin main --force-with-lease
            DIFF_ARG="--diff $PREV_SHA"
          else
            DIFF_ARG=""
          fi

          npm install --no-save typescript
          cp ../automation/scripts/check-i18n-gaps.mjs ./.tmp-check-i18n-gaps.mjs
          node ./.tmp-check-i18n-gaps.mjs --json $DIFF_ARG > ../gaps.json
          rm -f ./.tmp-check-i18n-gaps.mjs

          MISSING_COUNT=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("../gaps.json","utf8")).missing.length)')
          UNWRAPPED_COUNT=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("../gaps.json","utf8")).unwrapped.length)')
          echo "missing=$MISSING_COUNT" >> "$GITHUB_OUTPUT"
          echo "unwrapped=$UNWRAPPED_COUNT" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "prev_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"

      - name: Update tracking issue on GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const gaps = JSON.parse(fs.readFileSync("gaps.json", "utf8"));
            const missingCount = gaps.missing.length;
            const unwrappedCount = gaps.unwrapped.length;
            const upstreamSha = "${{ steps.scan.outputs.upstream_sha }}";
            const label = "i18n-automation";
            const title = "i18n(fr): upstream translation gaps";

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: "0e8a16", description: "Automated French i18n gap tracker" });
            }

            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: label,
            });
            const openIssue = existing.data[0];

            if (missingCount === 0 && unwrappedCount === 0) {
              if (openIssue) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: openIssue.number,
                  body: `All gaps resolved on upstream \`${upstreamSha.slice(0, 9)}\`. Closing.`,
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: openIssue.number,
                  state: "closed",
                });
              }
              return;
            }

            const payload = JSON.stringify({ upstreamSha, ...gaps }, null, 2);
            const body = [
              `Upstream \`Lebbitheplow/open-game-master@main\` (\`${upstreamSha.slice(0, 9)}\`) has **${missingCount} missing \`t()\`/\`tp()\` keys** and **${unwrappedCount} potential unwrapped UI strings**.`,
              "",
              "### Instructions for Gemini Scheduled Task",
              "1. Read the JSON below and inspect the cited `.ts`/`.tsx` files if you need surrounding context.",
              "2. Create branch `i18n/delta-<YYYY-MM-DD>` from `main` and commit **only** `i18n-delta-fr.json` with the French translations.",
              "3. Stage 2 (`i18n-apply-delta.yml`) will merge it into `src/lib/i18n/fr.json`, run `test-i18n-gettext.mjs`, and open a Draft PR.",
              "",
              "<details>",
              "<summary>Gap payload (JSON)</summary>",
              "",
              "```json",
              payload.slice(0, 55000),
              "```",
              "</details>",
            ].join("\n");

            if (openIssue) {
              await github.rest.issues.update({ ...context.repo, issue_number: openIssue.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
            }
