name: Check Upstream i18n Gaps

on:
  schedule:
    # Run daily at 05:00 UTC (midnight EST / 01:00 EDT in Montreal)
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: automation
          path: automation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync main with upstream, update i18n/fr-sync, and scan for gaps
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --branch main --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" upstream-work
          cd upstream-work
          PREV_SHA=$(git rev-parse HEAD)
          git remote add upstream https://github.com/Lebbitheplow/open-game-master.git
          git fetch upstream main
          UPSTREAM_SHA=$(git rev-parse upstream/main)

          if [ "$PREV_SHA" != "$UPSTREAM_SHA" ]; then
            git reset --hard "$UPSTREAM_SHA"
            git push origin main --force-with-lease
            DIFF_ARG="--diff $PREV_SHA"
          else
            DIFF_ARG=""
          fi

          # Maintain a single rolling French staging branch on top of main so
          # previously translated strings accumulate cleanly until playtest/PR.
          if git ls-remote --exit-code --heads origin i18n/fr-sync >/dev/null 2>&1; then
            git fetch origin i18n/fr-sync
            git checkout -B i18n/fr-sync origin/i18n/fr-sync
            if ! git merge --no-edit main; then
              git merge --abort || true
              git merge --no-edit -X ours main
            fi
            git push origin i18n/fr-sync
          else
            git checkout -B i18n/fr-sync main
            git push origin i18n/fr-sync
          fi

          npm install --no-save typescript
          cp ../automation/scripts/check-i18n-gaps.mjs ./.tmp-check-i18n-gaps.mjs
          node ./.tmp-check-i18n-gaps.mjs --json $DIFF_ARG > ../gaps.json
          rm -f ./.tmp-check-i18n-gaps.mjs

          MISSING_COUNT=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("../gaps.json","utf8")).missing.length)')
          UNWRAPPED_COUNT=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("../gaps.json","utf8")).unwrapped.length)')
          CHANGED_COUNT=$(node -e 'console.log((JSON.parse(require("fs").readFileSync("../gaps.json","utf8")).changedFiles || []).length)')
          echo "missing=$MISSING_COUNT" >> "$GITHUB_OUTPUT"
          echo "unwrapped=$UNWRAPPED_COUNT" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED_COUNT" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "prev_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"

      - name: Update tracking issue on GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const gaps = JSON.parse(fs.readFileSync("gaps.json", "utf8"));
            const missingCount = gaps.missing.length;
            const unwrappedCount = gaps.unwrapped.length;
            const changedCount = (gaps.changedFiles || []).length;
            const upstreamSha = "${{ steps.scan.outputs.upstream_sha }}";
            const prevSha = "${{ steps.scan.outputs.prev_sha }}";
            const label = "i18n-automation";
            const title = "i18n(fr): upstream translation gaps";

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: "0e8a16", description: "Automated French i18n gap tracker" });
            }

            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: label,
            });
            const openIssue = existing.data[0];

            if (missingCount === 0 && unwrappedCount === 0 && changedCount === 0) {
              if (openIssue) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: openIssue.number,
                  body: `All gaps resolved on \`i18n/fr-sync\` (upstream \`${upstreamSha.slice(0, 9)}\`). Closing.`,
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: openIssue.number,
                  state: "closed",
                });
              }
              return;
            }

            const payload = JSON.stringify({ prevSha, upstreamSha, ...gaps }, null, 2);
            const body = [
              `Upstream \`Lebbitheplow/open-game-master@main\` (\`${prevSha.slice(0, 9)}..${upstreamSha.slice(0, 9)}\`) has **${missingCount} missing \`t()\`/\`tp()\` keys**, **${unwrappedCount} potential unwrapped UI strings**, and **${changedCount} changed \`src/**/*.{ts,tsx}\` files** on \`i18n/fr-sync\`.`,
              "",
              "### Instructions for Gemini Scheduled Task",
              "1. Read the JSON below (`missing`, `unwrapped`, and `changedFiles`).",
              "2. Inspect the surrounding code around cited `file:line` entries AND review `changedFiles` on `i18n/fr-sync` for any hardcoded English UI text, `.ts` message builders, tooltips, or errors missed by the AST scanner.",
              "3. Wire any genuine user-facing unwrapped strings in `.ts`/`.tsx` files with `t()`/`tp()` directly on `i18n/fr-sync`, and commit `i18n-delta-fr.json` at the repo root of `i18n/fr-sync` with French translations for both `missing` keys and any newly wired keys.",
              "4. Stage 2 (`i18n-apply-delta.yml`) will merge `i18n-delta-fr.json` into `src/lib/i18n/fr.json`, run `test-i18n-gettext.mjs` and `check-i18n-gaps.mjs --strict`, and update the Draft PR against `main`.",
              "",
              "<details>",
              "<summary>Gap payload (JSON)</summary>",
              "",
              "```json",
              payload.slice(0, 55000),
              "```",
              "</details>",
            ].join("\n");

            if (openIssue) {
              await github.rest.issues.update({ ...context.repo, issue_number: openIssue.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
            }
